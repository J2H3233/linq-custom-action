// java.toolchain이 요구하는 JDK 11이 로컬에 없을 때 자동으로 받아오게 함.
// 이게 없으면 로컬에 JDK 11을 설치/탐지해둔 사람만 빌드가 된다.
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'CustomPackageExample'
